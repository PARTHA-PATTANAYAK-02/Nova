<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Nova</title>

    <meta
      name="description"
      content="A quieter place to be loud. Share moments, find your people."
    />

    <!-- 🎨 Midnight → Lavender theme colors -->
    <meta
      name="theme-color"
      content="#6366F1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#08061A"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph (WhatsApp/Twitter share) -->
    <meta property="og:title" content="Nova" />
    <meta
      property="og:description"
      content="A quieter place to be loud. Share moments, find your people."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nova" />
    <meta
      name="twitter:description"
      content="A quieter place to be loud. Share moments, find your people."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
